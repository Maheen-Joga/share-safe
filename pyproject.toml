[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "share-safe"
version = "0.1.0"
description = "Make logs, configs and error messages safe to share: API keys, tokens, passwords, emails and IPs become consistent placeholders. Also a Claude skill."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maheen Joga" }]
keywords = ["redact", "secrets", "privacy", "logs", "pii", "gdpr", "claude-skill"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["share_safe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
